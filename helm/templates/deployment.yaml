{{- /*
STAM-63 / AC1: Rollout, not Deployment — progressive canary with
Prometheus-gated analysis instead of an all-at-once rolling update.
Only booking and payment get this (the two services on the saga's
money path); the other four stay plain Deployments.
*/ -}}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "booking.fullname" . }}
  labels:
    {{- include "booking.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # ponytail: no trafficRouting provider (no Istio/Nginx/ALB in this stack),
  # so setWeight is only approximated by canary:stable replica ratio — at
  # replicaCount below ~5 the steps below don't land close to 10%/50%.
  # Upgrade path: a trafficRouting block once Sprint 3's ingress is chosen.
  strategy:
    canary:
      steps:
        - setWeight: 10
        - analysis:
            templates:
              - templateName: {{ include "booking.fullname" . }}-success-rate-and-latency
        - setWeight: 50
        - analysis:
            templates:
              - templateName: {{ include "booking.fullname" . }}-success-rate-and-latency
        - setWeight: 100
  selector:
    matchLabels:
      {{- include "booking.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "booking.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: {{ include "booking.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "booking.fullname" . }}
            {{- if .Values.secretName }}
            - secretRef:
                name: {{ .Values.secretName }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: 8080
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: 8080
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: 8080
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
      volumes:
        - name: tmp
          emptyDir: {}
